name: ci

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

jobs:
  build-vet-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: build
        run: go build ./...

      - name: vet
        run: |
          go vet ./...
          go vet -tags integration ./...

      - name: unit tests
        run: go test ./...

      - name: ensure tmux
        run: |
          if command -v tmux >/dev/null; then
            tmux -V
          else
            sudo apt-get update && sudo apt-get install -y tmux
            tmux -V
          fi

      - name: integration suite (godog)
        run: make integration
